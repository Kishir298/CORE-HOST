name: CI
on:
  push:
    # Feature, fix and restructure branches are validated on push so a
    # candidate commit has evidence before a pull request exists.
    branches: [main, 'feat/**', 'fix/**', 'restructure/**']
  pull_request:
    branches: [main]
jobs:
  core-host:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: pip install ruff
      - run: ruff check --select E9,F,I core tests
      - name: Shell script syntax
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "$script"
          done < <(git ls-files '*.sh')
      # Short tracebacks: a failing test must show its assertion and frame,
      # not just the test id.
      - run: python -m pytest -q --tb=short
  core-host-windows:
    name: core-host (Windows, full)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: pip install ruff
      - run: ruff check --select E9,F,I core tests
      - run: python -m pytest -q --tb=short
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install host package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Verify installed command from another directory
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          core-host --help
          core-host doctor --data "${{ runner.temp }}/core-data"
