core:
  name: "C.O.R.E."
  version: "0.3.0"

environment: "development"

logging:
  level: "INFO"

security:
  # Authorization enforcement on service operations is opt-in. It is
  # inactive until a cross-system security boundary actually exists.
  enforce_authorization: false
  # Plaintext logging of external-device tokens. ALWAYS false in normal
  # configurations; enable explicitly only for physical dev testing.
  log_external_device_tokens: false

communication:
  enabled: true

network:
  enabled: false

web:
  # Localhost host portal (presentation only; never binds 0.0.0.0 unless
  # host is explicitly changed — remote administration is opt-in).
  enabled: true
  host: "127.0.0.1"
  port: 8765
  auto_open_browser: false
  location:
    enabled: true
    precision: approximate  # exact | approximate | city | hidden

components:
  configuration:
    enabled: true
  logging:
    enabled: true
  security:
    enabled: true
  resources:
    enabled: true
  organization:
    enabled: true
  events:
    enabled: true
  communication:
    enabled: true
  routing:
    enabled: true
  health:
    enabled: true
  dependencies:
    enabled: true
  services:
    enabled: true