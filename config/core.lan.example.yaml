# C.O.R.E. LAN example — Windows host ↔ Mac external device.
#
# Copy to a local file (never commit the copy with real paths):
#   copy config\core.lan.example.yaml config\core.lan.yaml
# Start with:
#   py -m core --config config\core.lan.yaml start
#
# Firewall port 5000 must already allow inbound TCP (see docs/windows-firewall.md).
# TLS stays ENABLED for any external binding; C.O.R.E. fails closed without it.

core:
  name: "C.O.R.E."
  version: "0.3.0"

environment: "production"

logging:
  level: "INFO"

security:
  # External devices REQUIRE the token provider. Never use existence here.
  provider: token
  enforce_authorization: false
  # Plaintext logging of external-device login tokens (development only).
  # Default false (tokens appear as <REDACTED>); set true explicitly for
  # physical LAN testing. Tokens are NEVER persisted regardless of this flag.
  log_external_device_tokens: false

communication:
  enabled: true
  transport: tcp
  host: "0.0.0.0"
  port: 5000
  # Authoritative per-connection lease in seconds (24 hours). The timer
  # starts at successful authentication of each client connection.
  connection_lease_seconds: 86400
  tls:
    enabled: true
    certfile: "C:\\path\\to\\core.crt"
    keyfile: "C:\\path\\to\\core.key"

network:
  enabled: true

rescs:
  adapter: file
  path: "var/rescs.json"

components:
  configuration:
    enabled: true
  logging:
    enabled: true
  security:
    enabled: true
  resources:
    enabled: true
  organization:
    enabled: true
  events:
    enabled: true
  communication:
    enabled: true
  routing:
    enabled: true
  health:
    enabled: true
  dependencies:
    enabled: true
  services:
    enabled: true
