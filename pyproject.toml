[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "core"
version = "0.4.0"
description = "Communication, Organization and Resource Engine"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
core-host = "core.entrypoint:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]
monitoring = ["prometheus-client>=0.20", "fastapi>=0.110"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]

[tool.setuptools.package-data]
"core.web" = ["portal.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
